<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MySpotify">
  <title>MySpotify</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/images/icon.png">
</head>
<body>
  <header class="header">
    <h1>♫ MySpotify</h1>
    <button class="profile-button" type="button" aria-label="MySpotify">M</button>
  </header>

  <main class="main-content">
    <h2>Guten Abend 👋</h2>

    <section class="library-tools">
      <input id="search-input" type="search" placeholder="Songs und Playlists suchen…" aria-label="Suche">
      <button id="show-all-button" class="filter-button active" type="button">Alle Songs</button>
      <button id="show-favorites-button" class="filter-button" type="button">♥ Favoriten</button>
      <button id="create-playlist-button" class="upload-button" type="button">＋ Playlist erstellen</button>
    </section>

    <section class="music-section">
      <div class="music-heading">
        <h2 id="section-title">Deine Musik</h2>
        <label for="music-upload" class="upload-button">＋ Songs hinzufügen</label>
        <input type="file" id="music-upload" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac" multiple hidden>
      </div>

      <button type="button" id="google-connect-button" class="drive-button">☁️ Mit Google Drive verbinden</button>
      <p id="upload-status" class="status">Deine Musik wird automatisch gespeichert.</p>

      <h3 class="subheading">Deine Playlists</h3>
      <div id="playlist-list" class="playlist-grid"></div>

      <h3 class="subheading">Songs</h3>
      <div id="song-list" class="song-list">
        <div class="empty-music"><span>🎶</span><h3>Noch keine Musik vorhanden</h3><p>Füge deine eigenen Songs hinzu.</p></div>
      </div>
    </section>
  </main>

  <div class="music-player">
    <div class="current-song">
      <img id="player-cover" class="player-cover" alt="" hidden>
      <div id="player-cover-placeholder" class="player-cover">🎵</div>
      <div class="song-info">
        <strong id="current-title">Kein Song ausgewählt</strong>
        <span id="current-artist">MySpotify</span>
      </div>
    </div>
    <div class="player-controls">
      <div class="control-buttons">
        <button id="previous-btn" type="button" aria-label="Vorheriger Song">⏮</button>
        <button id="play-btn" class="play-button" type="button" aria-label="Abspielen">▶</button>
        <button id="next-btn" type="button" aria-label="Nächster Song">⏭</button>
      </div>
      <div class="progress-container">
        <span id="current-time">0:00</span>
        <input type="range" id="progress" min="0" max="100" value="0">
        <span id="duration">0:00</span>
      </div>
    </div>
    <div class="volume-control"><span>🔊</span><input type="range" id="volume" min="0" max="1" step="0.01" value="0.7"></div>
  </div>

  <audio id="audio-player"></audio>

  <footer class="bottom-navigation">
    <button id="nav-home" type="button">⌂<span>Start</span></button>
    <button id="nav-search" type="button">⌕<span>Suche</span></button>
    <button id="nav-library" type="button">♫<span>Mediathek</span></button>
  </footer>

  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="google-drive.js"></script>
  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(error => console.error("Service Worker Fehler:", error));
      });
    }
  </script>
</body>
</html>
